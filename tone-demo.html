<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAD16 Tone.js Demo</title>
  </head>
  <body>
    <main class="device tone-page">
      <header id="header" class="top"></header>

      <section class="tone-controls" aria-label="Sound">
        <label class="tone-control">
          <span class="small-label">Wave</span>
          <select id="wave"></select>
        </label>
        <label class="tone-control">
          <span class="small-label">Delay</span>
          <input id="delay" type="range" min="0" max="1" step="0.01" value="0.3" />
        </label>
        <label class="tone-control">
          <span class="small-label">Volume</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" />
        </label>
      </section>

      <section id="keys" class="tone-keys" aria-label="Keys"></section>

      <footer class="footnote">
        The only page that uses Tone.js &middot; a polyphonic synth into a feedback delay, on the shared audio engine
        &middot; hold a key to sustain the note
      </footer>
    </main>
    <script type="module" src="/apps/tone-demo/main.js"></script>
  </body>
</html>
