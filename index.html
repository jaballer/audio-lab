<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAD16 Sampler</title>
    <link rel="stylesheet" href="/shared/loading.css" />
    <noscript
      ><style>
        .loading-screen {
          display: none;
        }
      </style></noscript
    >
  </head>
  <body>
    <div id="loading" class="loading-screen" role="status">
      <span class="loading-name">Audio <b>Lab</b></span>
      <span class="loading-bar" aria-hidden="true"></span>
      <span class="loading-text">Loading</span>
    </div>
    <header id="site-header"></header>
    <div id="audio-notice" class="audio-notice" role="status" hidden></div>
    <main class="device">
      <header id="header" class="top"></header>

      <div class="body">
        <section class="pad-panel" aria-label="Pads">
          <div id="pads" class="sampler-pads"></div>
        </section>

        <section class="console" aria-label="Display and controls">
          <div class="lcd" role="status" aria-label="Display">
            <div class="lcd-screen">
              <div class="lcd-line" id="lcd-1"></div>
              <div class="lcd-line" id="lcd-2"></div>
              <div class="lcd-line" id="lcd-3"></div>
              <div class="ruler" id="ruler" aria-hidden="true"></div>
              <div class="lcd-line lcd-msg" id="lcd-msg"></div>
            </div>
          </div>

          <div class="seq-bar" role="group" aria-label="Sequence and its length">
            <span class="small-label">Seq</span>
            <button id="seq-prev" class="btn btn-small" type="button" aria-label="Previous sequence">&lt;</button>
            <span id="seq-number" class="small-label" aria-live="polite"></span>
            <button id="seq-next" class="btn btn-small" type="button" aria-label="Next sequence">&gt;</button>
            <span class="small-label">Bars</span>
            <div id="bars" class="seq-lengths" role="group" aria-label="Sequence length in bars"></div>
          </div>

          <div class="controls">
            <div class="ctl">
              <div
                id="knob"
                class="knob"
                role="slider"
                tabindex="0"
                aria-label="Tempo in beats per minute"
                aria-valuemin="40"
                aria-valuemax="240"
                aria-valuenow="100"
              ></div>
              <span class="small-label">Tempo</span>
            </div>

            <div class="ctl ctl-fader">
              <input id="vol" class="fader" type="range" min="0" max="100" value="80" aria-label="Master volume" />
              <span class="small-label">Volume</span>
            </div>

            <div class="buttons">
              <button id="play" class="btn btn-led" type="button" aria-pressed="false">Play</button>
              <button id="stop" class="btn" type="button">Stop</button>
              <button id="rec" class="btn btn-led btn-rec" type="button" aria-pressed="false">Rec</button>
              <button id="tap" class="btn" type="button">Tap Tempo</button>
              <button id="clear" class="btn" type="button">Clear Pad</button>
              <button id="clear-all" class="btn" type="button">Clear All</button>
            </div>
          </div>
        </section>
      </div>

      <section class="step-panel" aria-label="Step keys for the selected pad">
        <div class="step-head">
          <div class="small-label">Step keys &middot; selected pad</div>
          <div class="step-nav" role="group" aria-label="Which bar is shown">
            <button id="steps-prev" class="btn btn-small" type="button" aria-label="Previous bar">&lt;</button>
            <span id="steps-range" class="small-label" aria-live="polite"></span>
            <button id="steps-next" class="btn btn-small" type="button" aria-label="Next bar">&gt;</button>
          </div>
        </div>
        <div id="steps"></div>
      </section>
    </main>

    <aside class="help-panel" aria-labelledby="help-title">
      <h2 id="help-title" class="help-title">Help</h2>
      <ul class="help-list">
        <li>
          Click the pads, or play them with the keys <kbd>1</kbd>–<kbd>4</kbd> <kbd>Q</kbd>–<kbd>R</kbd>
          <kbd>A</kbd>–<kbd>F</kbd> <kbd>Z</kbd>–<kbd>V</kbd>
        </li>
        <li><kbd>Space</kbd> plays or stops the sequence</li>
        <li><a href="./keyboard.html">Keyboard test</a> is a page for trying a MIDI keyboard</li>
      </ul>
    </aside>
    <!-- First, so its timeout starts even when the page's own script is slow to arrive. -->
    <script type="module" src="/shared/loading-screen.js"></script>
    <script type="module" src="/apps/sampler/main.js"></script>
  </body>
</html>
