<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAD16 Keys</title>
  </head>
  <body>
    <main class="mpk">
      <header class="top">
        <div class="brand">
          <span class="brand-name">KEYS</span>
          <span class="brand-sub">MIDI keyboard test</span>
        </div>
        <div class="power">
          <a class="btn btn-small nav-link" href="./">&larr; Sampler</a>
          <button id="midi-btn" class="btn btn-small" type="button">Connect MIDI</button>
          <span id="midi-status" class="small-label" role="status">MIDI: off</span>
        </div>
      </header>

      <section class="deck" aria-label="Controller">
        <div class="deck-block stick-block">
          <div class="stick-well" aria-hidden="true">
            <div id="stick-ball" class="stick-ball"></div>
          </div>
          <span class="small-label">Pitch / Mod</span>
        </div>

        <div class="deck-block">
          <div id="pads" class="pads" aria-label="Pads"></div>
          <span class="small-label">Pads &middot; hit each once to label them</span>
        </div>

        <div class="deck-block">
          <div id="knobs" class="knobs" aria-label="Knobs"></div>
          <span class="small-label">Knobs &middot; turn K1&ndash;K8 once, in order, to label them</span>
        </div>
      </section>

      <div id="piano" class="piano" aria-label="Piano keys"></div>

      <section class="monitor" aria-label="Monitor and envelope">
        <div class="lcd" role="status" aria-label="Display">
          <div class="lcd-screen kb-screen">
            <div class="lcd-line" id="lcd-note"></div>
            <div class="lcd-line" id="lcd-vel"></div>
            <div class="lcd-line" id="lcd-wheels"></div>
            <div class="lcd-line" id="lcd-cc"></div>
            <div class="lcd-line" id="lcd-pad"></div>
          </div>
        </div>

        <section class="env" aria-label="Envelope">
          <div class="small-label env-title">Envelope &middot; ADSR</div>
          <div class="env-grid">
            <label class="env-ctl">
              <span class="small-label">Attack</span>
              <input id="env-attack" type="range" min="0" max="100" step="any" />
              <output id="out-attack"></output>
            </label>
            <label class="env-ctl">
              <span class="small-label">Decay</span>
              <input id="env-decay" type="range" min="0" max="100" step="any" />
              <output id="out-decay"></output>
            </label>
            <label class="env-ctl">
              <span class="small-label">Sustain</span>
              <input id="env-sustain" type="range" min="0" max="100" step="any" />
              <output id="out-sustain"></output>
            </label>
            <label class="env-ctl">
              <span class="small-label">Release</span>
              <input id="env-release" type="range" min="0" max="100" step="any" />
              <output id="out-release"></output>
            </label>
          </div>
        </section>
      </section>

      <footer class="footnote">
        Computer keys: <kbd>A</kbd> <kbd>W</kbd> <kbd>S</kbd> <kbd>E</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>T</kbd>
        <kbd>G</kbd> <kbd>Y</kbd> <kbd>H</kbd> <kbd>U</kbd> <kbd>J</kbd> <kbd>K</kbd> play one octave
        &middot; the view follows your keyboard's octave
      </footer>
    </main>
    <script type="module" src="/apps/keys/main.js"></script>
  </body>
</html>
