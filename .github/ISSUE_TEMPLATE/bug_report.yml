name: Bug report
description: Something sounds, looks or behaves wrong.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw or heard, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: Page
      options:
        - Sampler (index.html)
        - Keys (keyboard.html)
        - MPC Sample companion (mpc-sample.html)
        - MIDI monitor (monitor.html)
        - Tone.js demo (tone-demo.html)
        - Not page-specific
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the sampler
        2. Press pad 3
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: Web Audio and Web MIDI differ between browsers, so the version matters.
      placeholder: Firefox 150 on Linux
    validations:
      required: true
  - type: textarea
    id: midi
    attributes:
      label: MIDI controller and port names
      description: >-
        Only if a controller is involved. Device profiles match on the exact port name, and a browser can name the
        input and the output differently, so give both. The input name is on the MIDI monitor page (monitor.html). For
        the output name (needed for Launchpad lights), run this in the browser console:
        [...(await navigator.requestMIDIAccess()).outputs.values()].map((p) => p.name)
      placeholder: |
        Input: Launchpad Mini 9 MIDI 1
        Output: Launchpad Mini 9 MIDI 1
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Any errors from the browser console. Leave empty if there are none.
      render: text
