<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1d1b19" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>PAD16 Keys</title>
    <link rel="stylesheet" href="/shared/loading.css" />
    <noscript
      ><style>
        .loading-screen {
          display: none;
        }
      </style></noscript
    >
  </head>
  <body>
    <div id="loading" class="loading-screen" role="status">
      <span class="loading-name">Audio <b>Lab</b></span>
      <span class="loading-bar" aria-hidden="true"></span>
      <span class="loading-text">Loading</span>
    </div>
    <header id="site-header"></header>
    <div id="update-notice" class="update-notice" role="status" hidden></div>
    <div id="audio-notice" class="audio-notice" role="status" hidden></div>
    <main class="mpk">
      <header id="header" class="top"></header>

      <section class="deck" aria-label="Controller">
        <div class="deck-block stick-block">
          <div class="stick-well" aria-hidden="true">
            <div id="stick-ball" class="stick-ball"></div>
          </div>
          <span class="small-label">Pitch / Mod</span>
        </div>

        <div class="deck-block display-block">
          <!-- A group, not a live region: the lines change on every note, bend and controller. -->
          <div class="lcd kb-lcd" role="group" aria-label="Display">
            <div class="lcd-screen">
              <div class="lcd-line" id="lcd-note"></div>
              <div class="lcd-line" id="lcd-vel"></div>
              <div class="lcd-line" id="lcd-wheels"></div>
              <div class="lcd-line" id="lcd-knob"></div>
              <div class="lcd-line" id="lcd-cc"></div>
            </div>
          </div>
        </div>

        <div class="deck-block">
          <div id="knobs" class="knobs" aria-label="Knobs"></div>
          <span class="small-label">Knobs &middot; K1&ndash;K4 envelope, K5&ndash;K8 tone</span>
        </div>
      </section>

      <div id="piano" class="piano" aria-label="Piano keys"></div>
    </main>

    <aside class="help-panel" aria-labelledby="help-title">
      <h2 id="help-title" class="help-title">Help</h2>
      <ul class="help-list">
        <li>
          Computer keys: <kbd>A</kbd> <kbd>W</kbd> <kbd>S</kbd> <kbd>E</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>T</kbd>
          <kbd>G</kbd> <kbd>Y</kbd> <kbd>H</kbd> <kbd>U</kbd> <kbd>J</kbd> <kbd>K</kbd> play one octave
        </li>
        <li>The view follows your keyboard's octave</li>
        <li>The knobs need the controller on Program 2 (hold Prog Select and press Pad 6)</li>
      </ul>
    </aside>
    <!-- First, so its timeout starts even when the page's own script is slow to arrive. -->
    <script type="module" src="/shared/loading-screen.js"></script>
    <script type="module" src="/apps/keys/main.js"></script>
  </body>
</html>
