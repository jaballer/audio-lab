<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAD16 Tone.js Demo</title>
    <link rel="stylesheet" href="/shared/loading.css" />
    <noscript
      ><style>
        .loading-screen {
          display: none;
        }
      </style></noscript
    >
  </head>
  <body>
    <div id="loading" class="loading-screen" role="status">
      <span class="loading-name">Audio <b>Lab</b></span>
      <span class="loading-bar" aria-hidden="true"></span>
      <span class="loading-text">Loading</span>
    </div>
    <header id="site-header"></header>
    <main class="device tone-page">
      <header id="header" class="top"></header>

      <section class="tone-controls" aria-label="Sound">
        <label class="tone-control">
          <span class="small-label">Wave</span>
          <select id="wave"></select>
        </label>
        <label class="tone-control">
          <span class="small-label">Delay</span>
          <input id="delay" type="range" min="0" max="1" step="0.01" value="0.3" />
        </label>
        <label class="tone-control">
          <span class="small-label">Volume</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" />
        </label>
      </section>

      <section id="keys" class="tone-keys" aria-label="Keys"></section>
    </main>

    <aside class="help-panel" aria-labelledby="help-title">
      <h2 id="help-title" class="help-title">Help</h2>
      <ul class="help-list">
        <li>The only page that uses Tone.js: a polyphonic synth into a feedback delay, on the shared audio engine</li>
        <li>Hold a key to sustain the note</li>
        <li>Play from the computer keyboard too: A W S E D F T G Y H U J K, from C to the C above</li>
      </ul>
    </aside>
    <!-- First, so its timeout starts even when the page's own script is slow to arrive. -->
    <script type="module" src="/shared/loading-screen.js"></script>
    <script type="module" src="/apps/tone-demo/main.js"></script>
  </body>
</html>
