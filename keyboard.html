<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAD16 Keys</title>
  </head>
  <body>
    <header id="site-header"></header>
    <main class="mpk">
      <header id="header" class="top"></header>

      <section class="deck" aria-label="Controller">
        <div class="deck-block stick-block">
          <div class="stick-well" aria-hidden="true">
            <div id="stick-ball" class="stick-ball"></div>
          </div>
          <span class="small-label">Pitch / Mod</span>
        </div>

        <div class="deck-block">
          <div id="pads" class="keys-pads" aria-label="Pads"></div>
          <span class="small-label">Pads &middot; hit each once to label them</span>
        </div>

        <div class="deck-block">
          <div id="knobs" class="knobs" aria-label="Knobs"></div>
          <span class="small-label"
            >Knobs &middot; K1&ndash;K4 envelope, K5&ndash;K8 tone &middot; controller on Program 2 (Prog Select + Pad
            6)</span
          >
        </div>
      </section>

      <div id="piano" class="piano" aria-label="Piano keys"></div>

      <section class="monitor" aria-label="Monitor and envelope">
        <div class="lcd" role="status" aria-label="Display">
          <div class="lcd-screen kb-screen">
            <div class="lcd-line" id="lcd-note"></div>
            <div class="lcd-line" id="lcd-vel"></div>
            <div class="lcd-line" id="lcd-wheels"></div>
            <div class="lcd-line" id="lcd-cc"></div>
            <div class="lcd-line" id="lcd-pad"></div>
          </div>
        </div>

        <div id="synth" class="synth"></div>
      </section>
    </main>

    <aside class="help-panel" aria-labelledby="help-title">
      <h2 id="help-title" class="help-title">Help</h2>
      <ul class="help-list">
        <li>
          Computer keys: <kbd>A</kbd> <kbd>W</kbd> <kbd>S</kbd> <kbd>E</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>T</kbd>
          <kbd>G</kbd> <kbd>Y</kbd> <kbd>H</kbd> <kbd>U</kbd> <kbd>J</kbd> <kbd>K</kbd> play one octave
        </li>
        <li>The view follows your keyboard's octave</li>
      </ul>
    </aside>
    <script type="module" src="/apps/keys/main.js"></script>
  </body>
</html>
